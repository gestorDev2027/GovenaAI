# Render Blueprint do GestorGov (Render → New → Blueprint → este repositório).
# Variáveis com "sync: false" são preenchidas no painel do Render na primeira vez (segredos não ficam no código).
services:
  - type: web
    name: gestorgov
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Sem região no Brasil no Render: Virginia é a mais próxima do Supabase em São Paulo.
    region: virginia
    # O plano gratuito "dorme" sem acesso e para as rotinas (Scheduler e CompanyOS): use no mínimo o Starter.
    plan: starter
    autoDeploy: true
    envVars:
      # ── Modelo (Gemini) ──
      - key: GOOGLE_API_KEY
        sync: false
      - key: AGENTE_MODELO
        value: gemini-3.6-flash
      - key: AGENTE_RACIOCINIO
        value: livre

      # ── Banco (Supabase do GestorGov) ──
      # Pooler em modo SESSÃO (porta 5432): o Render não alcança a conexão direta do Supabase (só IPv6).
      # postgresql://gestorgov_app.<id-do-projeto>:<senha>@aws-0-sa-east-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: gestorgov
      # Storage (documentos do Conhecimento): Project Settings → API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_AGENTES
        value: agentes

      # ── Acesso ao painel ──
      - key: OS_SECURITY_KEY
        generateValue: true
      - key: PAINEL_GOOGLE_CLIENT_ID
        sync: false
      # O seu e-mail: vira o dono no primeiro login e aprova os demais.
      - key: PAINEL_DONO
        sync: false
      # Opcional: só estes domínios entram (separados por vírgula). Vazio: qualquer e-mail, pendente de aprovação.
      - key: PAINEL_DOMINIOS
        sync: false

      # ── Mapa da cidade (Mapbox): o token público (pk.), restrito ao domínio do Render no painel do Mapbox ──
      - key: MAPBOX_TOKEN
        sync: false

      # ── GestorGov ──
      # CompanyOS: as atividades de rotina dos setores viram Rotinas do Agno (agente/companyos.py).
      - key: GESTORGOV_COMPANYOS
        value: sim
      # Sem demonstração: cada organização é montada na implantação.
      - key: INATIVIDADE_MINUTOS
        value: "480"
      # ── Tarefas demoradas (agente/segundo_plano.py) ──
      # Padrão: documentos, importação do CNES e testes da Fábrica rodam numa thread deste servidor (serve no
      # plano grátis). Para levá-los ao Render Workflows: crie o serviço gestorgov-tarefas (modelo comentado abaixo),
      # troque para "sim" e acrescente RENDER_API_KEY (Account Settings → API Keys) só neste serviço.
      - key: GESTORGOV_WORKFLOWS
        value: nao

  # Render Workflows (opcional, pago por segundo de uso): cada tarefa numa máquina própria, com novas tentativas
  # (tarefas/main.py). Não recebe conexões: lê e grava no mesmo Supabase. Fica comentado porque o deploy atual é um
  # Web Service criado à mão, no plano grátis; para usar, descomente (ou crie em New → Workflow com os mesmos campos).
  # - type: workflow
  #   name: gestorgov-tarefas
  #   runtime: python
  #   region: virginia
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python -m tarefas.main
  #   envVars:
