# Render Blueprint do GestorGov (Render → New → Blueprint → este repositório).
# Variáveis com "sync: false" são preenchidas no painel do Render na primeira vez (segredos não ficam no código).
services:
  - type: web
    name: gestorgov
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Sem região no Brasil no Render: Virginia é a mais próxima do Supabase em São Paulo.
    region: virginia
    # O plano gratuito "dorme" sem acesso e para as rotinas (Scheduler e CompanyOS): use no mínimo o Starter.
    plan: starter
    autoDeploy: true
    envVars:
      # ── Modelo (Gemini) ──
      - key: GOOGLE_API_KEY
        sync: false
      - key: AGENTE_MODELO
        value: gemini-3.6-flash
      - key: AGENTE_RACIOCINIO
        value: livre

      # ── Banco (Supabase do GestorGov) ──
      # Pooler em modo SESSÃO (porta 5432): o Render não alcança a conexão direta do Supabase (só IPv6).
      # postgresql://gestorgov_app.<id-do-projeto>:<senha>@aws-0-sa-east-1.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: gestorgov
      # Storage (documentos do Conhecimento): Project Settings → API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_AGENTES
        value: agentes

      # ── Acesso ao painel ──
      - key: OS_SECURITY_KEY
        generateValue: true
      - key: PAINEL_GOOGLE_CLIENT_ID
        sync: false
      # O seu e-mail: vira o dono no primeiro login e aprova os demais.
      - key: PAINEL_DONO
        sync: false
      # Opcional: só estes domínios entram (separados por vírgula). Vazio: qualquer e-mail, pendente de aprovação.
      - key: PAINEL_DOMINIOS
        sync: false

      # ── Mapa da cidade (Mapbox): o token público (pk.), restrito ao domínio do Render no painel do Mapbox ──
      - key: MAPBOX_TOKEN
        sync: false

      # ── GestorGov ──
      # CompanyOS: as atividades de rotina dos setores viram Rotinas do Agno (agente/companyos.py).
      - key: GESTORGOV_COMPANYOS
        value: sim
      # Sem demonstração: cada prefeitura é montada na implantação (GESTORGOV_DEMO=itatiaia liga a de Itatiaia-RJ).
      - key: INATIVIDADE_MINUTOS
        value: "480"
      # ── Tarefas demoradas (Render Workflows, serviço gestorgov-tarefas abaixo; agente/segundo_plano.py) ──
      # Com a chave da API do Render (Account Settings → API Keys), documentos, importação do CNES e testes da
      # Fábrica rodam fora deste servidor. Sem ela, rodam numa thread daqui, como antes.
      - key: GESTORGOV_WORKFLOWS
        value: sim
      - key: RENDER_API_KEY
        sync: false

  # As tarefas demoradas: cada execução numa máquina própria, com novas tentativas (tarefas/main.py). Não recebe
  # conexões: lê e grava no mesmo Supabase. Os segredos vêm do serviço web (preenchidos uma vez só, lá).
  - type: workflow
    name: gestorgov-tarefas
    runtime: python
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python -m tarefas.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GOOGLE_API_KEY
        fromService: {type: web, name: gestorgov, envVarKey: GOOGLE_API_KEY}
      - key: AGENTE_MODELO
        fromService: {type: web, name: gestorgov, envVarKey: AGENTE_MODELO}
      - key: AGENTE_RACIOCINIO
        fromService: {type: web, name: gestorgov, envVarKey: AGENTE_RACIOCINIO}
      - key: DATABASE_URL
        fromService: {type: web, name: gestorgov, envVarKey: DATABASE_URL}
      - key: DATABASE_SCHEMA
        fromService: {type: web, name: gestorgov, envVarKey: DATABASE_SCHEMA}
      - key: SUPABASE_URL
        fromService: {type: web, name: gestorgov, envVarKey: SUPABASE_URL}
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService: {type: web, name: gestorgov, envVarKey: SUPABASE_SERVICE_ROLE_KEY}
      - key: SUPABASE_BUCKET_AGENTES
        fromService: {type: web, name: gestorgov, envVarKey: SUPABASE_BUCKET_AGENTES}
      - key: MAPBOX_TOKEN
        fromService: {type: web, name: gestorgov, envVarKey: MAPBOX_TOKEN}
